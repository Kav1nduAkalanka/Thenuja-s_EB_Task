    const ROLE_DEFINITIONS = {
      member:  { title: 'Team Member',       clearanceLevel: 'Level 1: Creator',       level: 1, color: 'bg-[#DEEBFF] text-[#0052CC] border-[#B3D4FF]' },
      leader:  { title: 'Team Leader',       clearanceLevel: 'Level 2: Reviewer',      level: 2, color: 'bg-[#FFF0B3] text-[#172B4D] border-[#FFE380]' },
      lcvp:    { title: 'LCVP oGV B2C',      clearanceLevel: 'Level 3: Final Sign-off', level: 3, color: 'bg-[#E3FCEF] text-[#006644] border-[#ABF5D1]' },
      admin:   { title: 'Candidate LCVP TM', clearanceLevel: 'Level 4: Governance',    level: 4, color: 'bg-[#EAE6FF] text-[#403294] border-[#C0B6F2]' }
    };

    function canTransition(role, fromCol, toCol) {
      const def = ROLE_DEFINITIONS[role];
      if (!def) return { allowed: false, reason: 'Unknown user authorization role.' };
      if (fromCol === toCol) return { allowed: false, reason: 'Deliverable is already in this status.' };

      if (fromCol === 'member' && toCol === 'leader') {
        if (def.level >= 2) return { allowed: true };
        return { allowed: false, reason: 'Clearance Level 2 (Team Leader, LCVP, or Admin) required to escalate deliverable to Team Leader Review.' };
      }
      if (fromCol === 'leader' && toCol === 'lcvp') {
        if (def.level >= 3) return { allowed: true };
        return { allowed: false, reason: 'Clearance Level 3 (LCVP oGV B2C or Candidate TM Admin) required to authorize final publication.' };
      }
      if (fromCol === 'leader' && toCol === 'member') {
        if (def.level >= 2) return { allowed: true };
        return { allowed: false, reason: 'Clearance Level 2 (Team Leader or higher) required to return deliverable for modifications.' };
      }
      if (fromCol === 'lcvp' && toCol === 'leader') {
        if (def.level >= 3) return { allowed: true };
        return { allowed: false, reason: 'Clearance Level 3 (LCVP or Admin) required to reopen finalized deliverables.' };
      }
      return { allowed: false, reason: `Direct transition from ${fromCol} to ${toCol} is restricted by oGV governance protocol.` };
    }

    // =========================================================================

    function ToastContainer({ toasts, onDismiss }) {
      return (
        <div className="fixed bottom-5 left-5 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none">
          {toasts.map(toast => {
            const isError = toast.type === 'error';
            const isSuccess = toast.type === 'success';
            const isWarning = toast.type === 'warning';
            
            let borderCls = 'border-[#DFE1E6] bg-white text-[#172B4D]';
            let iconEl = <InfoIcon className="w-4 h-4 text-[#0052CC] shrink-0 mt-0.5" />;
            
            if (isError) {
              borderCls = 'border-[#FF8F73] bg-[#FFEBE6] text-[#BF2600]';
              iconEl = <div className="w-2 h-2 rounded-full bg-[#FF5630] shrink-0 mt-1.5" />;
            } else if (isSuccess) {
              borderCls = 'border-[#79F2C0] bg-[#E3FCEF] text-[#006644]';
              iconEl = <CheckIcon className="w-4 h-4 text-[#36B37E] shrink-0 mt-0.5" />;
            } else if (isWarning) {
              borderCls = 'border-[#FFE380] bg-[#FFF0B3] text-[#172B4D]';
              iconEl = <InfoIcon className="w-4 h-4 text-[#FFAB00] shrink-0 mt-0.5" />;
            }

            return (
              <div 
                key={toast.id}
                className={`pointer-events-auto p-3.5 rounded-md border shadow-app-dropdown flex items-start justify-between gap-3 animate-app-fadeIn transition-all ${borderCls}`}
              >
                <div className="flex items-start gap-2.5 text-xs">
                  {iconEl}
                  <div>
                    {toast.title && <div className="font-bold mb-0.5">{toast.title}</div>}
                    <div className="leading-relaxed opacity-95">{toast.message}</div>
                  </div>
                </div>
                <button 
                  onClick={() => onDismiss(toast.id)} 
                  className="text-xs font-bold opacity-60 hover:opacity-100 p-1"
                >
                  &times;
                </button>
              </div>
            );
          })}
        </div>
      );
    }

    // =========================================================================
    function KanbanCard({ card, currentRole, onCardClick, onMoveCard, density = 'comfortable' }) {
      const issueKey = card.key || `OGV-${card.id.replace(/[^0-9]/g,'')||'101'}`;

      const getPriorityIcon = (p) => {
        if (p === 'high') return <PriorityHighIcon className="w-3.5 h-3.5" />;
        if (p === 'low') return <PriorityLowIcon className="w-3.5 h-3.5" />;
        return <PriorityMediumIcon className="w-3.5 h-3.5" />;
      };

      const getTypeBadge = (type) => {
        const map = {
          trend_based:   { cls: 'bg-[#EAE6FF] text-[#403294] border-[#C0B6F2]', label: 'Trend' },
          country_based: { cls: 'bg-[#E6FCFF] text-[#006644] border-[#79F2C0]', label: 'Country' },
          project_based: { cls: 'bg-[#DEEBFF] text-[#0052CC] border-[#B3D4FF]', label: 'Project' }
        };
        const m = map[type];
        if (!m) return null;
        return (
          <span key={type} className={`text-[10px] font-bold px-1.5 py-0.2 rounded border ${m.cls}`}>
            {m.label}
          </span>
        );
      };

      const renderWorkflowButton = () => {
        if (card.column === 'member') {
          const ck = canTransition(currentRole, 'member', 'leader');
          return (
            <button
              onClick={(e) => {
                e.stopPropagation();
                if (!ck.allowed) { alert(`ACCESS RESTRICTED:\n${ck.reason}`); return; }
                onMoveCard(card.id, 'leader');
              }}
              title={ck.allowed ? "Escalate to Team Leader Review" : ck.reason}
              className={`text-[11px] font-semibold px-2 py-0.5 rounded flex items-center gap-1 transition-all ${
                ck.allowed
                  ? 'bg-[#0052CC] text-white hover:bg-[#0747A6] shadow-xs'
                  : 'bg-[#EBECF0] text-[#A5ADBA] cursor-not-allowed border border-[#DFE1E6]'
              }`}
            >
              <span>Move to Review</span>
              <ArrowRightIcon className="w-3 h-3" />
            </button>
          );
        }
        if (card.column === 'leader') {
          const ckApprove = canTransition(currentRole, 'leader', 'lcvp');
          const ckReturn = canTransition(currentRole, 'leader', 'member');
          return (
            <div className="flex items-center gap-1">
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (!ckReturn.allowed) { alert(`ACCESS RESTRICTED:\n${ckReturn.reason}`); return; }
                  onMoveCard(card.id, 'member', 'Changes requested by reviewer.');
                }}
                title={ckReturn.allowed ? "Return to Member for modifications" : ckReturn.reason}
                className="text-[11px] font-semibold px-1.5 py-0.5 rounded bg-[#FFEBE6] text-[#BF2600] hover:bg-[#FFBDAD] border border-[#FF8F73] flex items-center gap-0.5 transition-colors"
              >
                <ArrowLeftIcon className="w-3 h-3" />
                <span>Return</span>
              </button>
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  if (!ckApprove.allowed) { alert(`ACCESS RESTRICTED:\n${ckApprove.reason}`); return; }
                  onMoveCard(card.id, 'lcvp');
                  triggerConfetti();
                }}
                title={ckApprove.allowed ? "Authorize publication as Ready to Post" : ckApprove.reason}
                className={`text-[11px] font-semibold px-2 py-0.5 rounded flex items-center gap-1 transition-all ${
                  ckApprove.allowed
                    ? 'bg-[#36B37E] text-white hover:bg-[#00875A] shadow-xs'
                    : 'bg-[#EBECF0] text-[#A5ADBA] cursor-not-allowed border border-[#DFE1E6]'
                }`}
              >
                <span>Approve</span>
                <ArrowRightIcon className="w-3 h-3" />
              </button>

    // =========================================================================
    // KANBAN BOARD VIEW
    // =========================================================================
    function KanbanBoard({
      cards,
      currentRole,
      currentUser,
      onCardClick,
      onMoveCard,
      onOpenAddModal,
      searchQuery,
      setSearchQuery,
      onShowToast
    }) {
      const [typeFilter, setTypeFilter] = useState('all');
      const [assigneeFilter, setAssigneeFilter] = useState('all');
      const [onlyMy, setOnlyMy] = useState(false);
      const [density, setDensity] = useState('comfortable');
      const [isStarred, setIsStarred] = useState(false);
      const [dragOverCol, setDragOverCol] = useState(null);

      const filtered = useMemo(() => {
        return cards.filter(card => {
          if (typeFilter !== 'all' && !card.types?.includes(typeFilter)) return false;
          if (assigneeFilter !== 'all' && card.uploaderName !== assigneeFilter) return false;
          if (onlyMy && currentUser && card.uploaderId !== currentUser.id && card.uploaderName !== currentUser.name) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const inTitle = card.title?.toLowerCase().includes(q);
            const inCap = card.caption?.toLowerCase().includes(q);
            const inAuthor = card.uploaderName?.toLowerCase().includes(q);
            const inKey = (card.key || '').toLowerCase().includes(q);
            if (!inTitle && !inCap && !inAuthor && !inKey) return false;
          }
          return true;
        });
      }, [cards, typeFilter, assigneeFilter, onlyMy, searchQuery, currentUser]);

      const memberCards = filtered.filter(c => c.column === 'member');
      const leaderCards = filtered.filter(c => c.column === 'leader');
      const lcvpCards = filtered.filter(c => c.column === 'lcvp');

      const columns = [
        {
          id: 'member',
          title: 'SUBMISSIONS',
          stage: 'Initial Creator Uploads & Content drafting',
          accentColor: 'border-t-4 border-[#0052CC]',
          headerBadge: 'bg-[#DEEBFF] text-[#0052CC]',
          wipLimit: 8,
          cards: memberCards
        },
        {
          id: 'leader',
          title: 'LEADER REVIEW',
          stage: 'Quality Assurance & Alignment Verification',
          accentColor: 'border-t-4 border-[#FFAB00]',
          headerBadge: 'bg-[#FFF0B3] text-[#172B4D]',
          wipLimit: 5,
          cards: leaderCards
        },
        {
          id: 'lcvp',
          title: 'READY TO POST',
          stage: 'LCVP Sign-off & Publication Archive',
          accentColor: 'border-t-4 border-[#36B37E]',
          headerBadge: 'bg-[#E3FCEF] text-[#006644]',
          wipLimit: 12,
          cards: lcvpCards
        }
      ];

      const handleDrop = (e, targetCol) => {
        e.preventDefault();
        setDragOverCol(null);
        const cardId = e.dataTransfer.getData('text/plain');
        if (!cardId) return;

        const card = cards.find(c => c.id === cardId);
        if (!card || card.column === targetCol) return;

        const ck = canTransition(currentRole, card.column, targetCol);
        if (!ck.allowed) {
          onShowToast({
            type: 'error',
            title: 'Transition Denied (RBAC Policy)',
            message: ck.reason
          });
          return;
        }

        onMoveCard(cardId, targetCol);
        if (targetCol === 'lcvp') triggerConfetti();
        onShowToast({
          type: 'success',
          title: 'Workflow Transitioned',
          message: `${card.key || card.title} moved to ${targetCol === 'lcvp' ? 'Ready to Post' : 'Leader Review'}.`
        });
      };

      return (
        <div className="flex flex-col gap-4">
          <div className="bg-white p-4 rounded-lg border border-[#DFE1E6] shadow-xs">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div>
                <div className="flex items-center gap-1.5 text-xs text-[#5E6C84] mb-1 font-medium">
                  <span className="hover:underline cursor-pointer">Projects</span>
                  <span>/</span>
                  <span className="hover:underline cursor-pointer">AIESEC in CS</span>
                  <span>/</span>
                  <span className="text-[#172B4D] font-semibold">Term 27.28 Sprint 1</span>
                </div>
                <div className="flex items-center gap-3">
                  <h1 className="text-xl font-bold text-[#172B4D] tracking-tight">
                    oGV B2C Deliverables Board
                  </h1>
                  <button 
                    onClick={() => setIsStarred(!isStarred)}
                    className="p-1 text-[#5E6C84] hover:bg-[#EBECF0] rounded transition-colors"
                    title={isStarred ? "Remove from starred" : "Star this board"}
                  >
                    <StarIcon className="w-4 h-4" filled={isStarred} />
                  </button>
                  <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-[#EBECF0] text-[#172B4D]">
                    Kanban
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                <div className="flex items-center gap-2 bg-[#FAFBFC] px-3 py-1.5 rounded border border-[#DFE1E6] text-xs font-semibold text-[#5E6C84]">
                  <span>Total: <strong className="text-[#172B4D]">{cards.length}</strong></span>
                  <span className="text-[#DFE1E6]">|</span>
                  <span>Ready: <strong className="text-[#006644]">{lcvpCards.length}</strong></span>
                </div>
                <button
                  onClick={() => {
                    navigator.clipboard?.writeText?.(window.location.href);
                    onShowToast({ type: 'success', title: 'Link Copied', message: 'Board URL copied to clipboard.' });
                  }}
                  className="px-2.5 py-1.5 text-xs font-semibold rounded border border-[#DFE1E6] hover:bg-[#EBECF0] text-[#42526E] flex items-center gap-1.5 transition-colors"
                >
                  <ShareIcon className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Share</span>
                </button>
                <button
                  onClick={onOpenAddModal}
                  className="px-3 py-1.5 bg-[#0052CC] hover:bg-[#0747A6] text-white text-xs font-semibold rounded shadow-xs flex items-center gap-1.5 transition-colors"
                >
                  <PlusIcon className="w-3.5 h-3.5 stroke-[2.5]" />
                  <span>Create Deliverable</span>
                </button>
              </div>
            </div>

            <div className="mt-4 pt-3 border-t border-[#EBECF0] flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <div className="relative w-40 sm:w-52">
                  <SearchIcon className="w-3.5 h-3.5 text-[#5E6C84] absolute left-2.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Filter board..."
                    className="w-full pl-8 pr-6 py-1 text-xs bg-[#FAFBFC] hover:bg-white border border-[#DFE1E6] rounded focus:bg-white focus:border-[#0052CC] focus:ring-1 focus:ring-[#0052CC] outline-none transition-all placeholder:text-[#5E6C84]"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-[#5E6C84] hover:text-[#172B4D]"
                    >
                      &times;
                    </button>
                  )}
                </div>

                <div className="flex items-center -space-x-1 pl-1">
                  {USERS.slice(0, 4).map(u => {
                    const isSel = assigneeFilter === u.name;
                    return (
                      <button
                        key={u.id}
                        onClick={() => setAssigneeFilter(isSel ? 'all' : u.name)}
                        title={`Filter by ${u.name}`}
                        className={`w-6 h-6 rounded-full ${u.avatarBg} text-white text-[10px] font-bold flex items-center justify-center border-2 transition-transform ${
                          isSel ? 'border-[#0052CC] scale-110 z-10' : 'border-white hover:scale-105'
                        }`}
                      >
                        {u.initials}
                      </button>
                    );
                  })}
                </div>

                <button
                  onClick={() => setOnlyMy(!onlyMy)}
                  className={`px-2.5 py-1 rounded text-xs font-medium transition-colors ${
                    onlyMy
                      ? 'bg-[#0052CC] text-white font-semibold'
                      : 'bg-[#F4F5F7] hover:bg-[#EBECF0] text-[#172B4D] border border-[#DFE1E6]'
                  }`}
                >
                  Only my deliverables
                </button>

                <div className="flex items-center gap-1 border-l border-[#DFE1E6] pl-2">
                  {[
                    ['all', 'All'],
                    ['trend_based', 'Trend'],
                    ['country_based', 'Country'],
                    ['project_based', 'Project']
                  ].map(([k, label]) => {
                    const isSel = typeFilter === k;
                    return (
                      <button
                        key={k}
                        onClick={() => setTypeFilter(k)}
                        className={`px-2.5 py-1 rounded text-xs transition-colors ${
                          isSel
                            ? 'bg-[#172B4D] text-white font-semibold shadow-xs'
                            : 'bg-[#F4F5F7] hover:bg-[#EBECF0] text-[#42526E] border border-[#DFE1E6]'
                        }`}
                      >
                        {label}
                      </button>
                    );
                  })}
                </div>

                {(typeFilter !== 'all' || assigneeFilter !== 'all' || searchQuery || onlyMy) && (
                  <button
                    onClick={() => {
                      setTypeFilter('all');
                      setAssigneeFilter('all');
                      setSearchQuery('');
                      setOnlyMy(false);
                    }}
                    className="text-xs text-[#0052CC] hover:underline px-1 font-semibold"
                  >
                    Clear filters
                  </button>
                )}
              </div>

              <div className="flex items-center gap-1 text-xs text-[#5E6C84]">
                <span className="hidden sm:inline">Density:</span>
                <button
                  onClick={() => setDensity(density === 'comfortable' ? 'compact' : 'comfortable')}
                  className="px-2 py-0.5 rounded border border-[#DFE1E6] bg-[#FAFBFC] hover:bg-[#EBECF0] text-[11px] font-semibold text-[#172B4D] transition-colors"
                >
                  {density === 'comfortable' ? 'Comfortable' : 'Compact'}
                </button>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {columns.map(col => {
              const isOver = dragOverCol === col.id;
              return (
                <div
                  key={col.id}
                  onDragOver={(e) => {
                    e.preventDefault();
                    if (dragOverCol !== col.id) setDragOverCol(col.id);
                  }}
                  onDragLeave={() => setDragOverCol(null)}
                  onDrop={(e) => handleDrop(e, col.id)}
                  className={`bg-[#F4F5F7] rounded-lg p-3 flex flex-col min-h-[600px] border transition-all ${col.accentColor} ${
                    isOver ? 'border-[#0052CC] bg-[#DEEBFF]/30 ring-2 ring-[#0052CC]' : 'border-[#DFE1E6]'
                  }`}
                >
                  <div className="flex items-center justify-between pb-2 mb-2 border-b border-[#EBECF0]">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-[#5E6C84] tracking-wider uppercase">
                        {col.title}
                      </span>
                      <span className={`text-[11px] font-bold px-2 py-0.2 rounded-full ${col.headerBadge}`}>
                        {col.cards.length}
                      </span>
                    </div>
                    <span className="text-[10px] text-[#5E6C84] font-medium">
                      Max: {col.wipLimit}
                    </span>
                  </div>

                  <p className="text-[11px] text-[#5E6C84] mb-3 leading-snug">
                    {col.stage}
                  </p>

                  <div className="flex-1 flex flex-col gap-2.5 overflow-y-auto">
                    {col.cards.map(card => (
                      <div
                        key={card.id}
                        draggable
                        onDragStart={(e) => {
                          e.dataTransfer.setData('text/plain', card.id);
                          e.dataTransfer.effectAllowed = 'move';
                        }}
                      >
                        <KanbanCard
                          card={card}
                          currentRole={currentRole}
                          onCardClick={onCardClick}
                          onMoveCard={onMoveCard}
                          density={density}
                        />
                      </div>
                    ))}

                    {col.cards.length === 0 && (
                      <div className="flex-1 border-2 border-dashed border-[#DFE1E6] rounded-md p-6 flex flex-col items-center justify-center text-center">
                        <p className="text-xs text-[#5E6C84] font-medium">No deliverables in this stage</p>
                        <p className="text-[10px] text-slate-400 mt-1">Drag items here or click Create</p>
                      </div>
                    )}
                  </div>

                  {col.id === 'member' && (
                    <button
                      onClick={onOpenAddModal}
                      className="mt-3 w-full py-1.5 px-2 bg-transparent hover:bg-[#EBECF0] text-[#5E6C84] hover:text-[#172B4D] text-xs font-semibold rounded flex items-center justify-center gap-1.5 transition-colors border border-transparent hover:border-[#DFE1E6]"
                    >
                      <PlusIcon className="w-3.5 h-3.5 stroke-[2.5]" />
                      <span>Create deliverable</span>
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =========================================================================

    function AddFlyerModal({ isOpen, onClose, onAddFlyer, currentUser, onShowToast }) {
      const [title, setTitle] = useState('');
      const [canvaUrl, setCanvaUrl] = useState('');
      const [caption, setCaption] = useState('');
      const [priority, setPriority] = useState('medium');
      const [types, setTypes] = useState(['trend_based']);

      if (!isOpen) return null;

      const toggleType = (k) => {
        if (types.includes(k)) {
          if (types.length === 1) return;
          setTypes(types.filter(t => t !== k));
        } else {
          setTypes([...types, k]);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || !canvaUrl.trim()) return;

        onAddFlyer({
          title: title.trim(),
          canvaUrl: canvaUrl.trim(),
          caption: caption.trim(),
          priority,
          types: types.length > 0 ? types : ['trend_based']
        });

        setTitle('');
        setCanvaUrl('');
        setCaption('');
        setPriority('medium');
        setTypes(['trend_based']);
        onClose();

        onShowToast({
          type: 'success',
          title: 'Issue Created',
          message: 'New deliverable logged into Submissions column.'
        });
      };

      const typeConfig = [
        { key: 'trend_based', label: 'Trend Based', desc: 'Social audio, reels, youth campus trends', active: 'bg-[#EAE6FF] border-[#C0B6F2] text-[#403294]' },
        { key: 'country_based', label: 'Country Based', desc: 'Destination portfolio (Vietnam, Egypt, Brazil)', active: 'bg-[#E6FCFF] border-[#79F2C0] text-[#006644]' },
        { key: 'project_based', label: 'Project Based', desc: 'SDG volunteer goals (SDG 4 Education, SDG 13 Climate)', active: 'bg-[#DEEBFF] border-[#B3D4FF] text-[#0052CC]' }
      ];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-app-fadeIn font-sans">
          <div className="bg-white rounded-lg w-full max-w-lg shadow-app-modal border border-[#DFE1E6] overflow-hidden flex flex-col text-[#172B4D]">
            <div className="px-6 py-3.5 border-b border-[#EBECF0] flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <TaskIcon className="w-4 h-4" />
                <h2 className="text-sm font-bold">Create Deliverable Issue</h2>
              </div>
              <button onClick={onClose} className="w-7 h-7 rounded hover:bg-[#EBECF0] text-[#5E6C84] hover:text-[#172B4D] flex items-center justify-center text-lg font-bold">
                &times;
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 flex flex-col gap-4 overflow-y-auto max-h-[80vh]">
              <div>
                <label className="block text-xs font-semibold text-[#5E6C84] mb-1.5">
                  Summary / Campaign Title <span className="text-[#FF5630]">*</span>
                </label>
                <input
                  type="text"
                  required
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="e.g. Global Classroom Vietnam: Winter 2026 Recruitment"
                  className="w-full text-sm px-3 py-2 rounded border border-[#DFE1E6] hover:border-[#4C9AFF] focus:border-[#0052CC] focus:ring-2 focus:ring-[#DEEBFF] outline-none transition-all placeholder:text-slate-400"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#5E6C84] mb-1.5">
                  Canva Design Asset Link <span className="text-[#FF5630]">*</span>
                </label>
                <input
                  type="url"
                  required
                  value={canvaUrl}
                  onChange={(e) => setCanvaUrl(e.target.value)}
                  placeholder="https://www.canva.com/design/DAG..."
                  className="w-full text-sm px-3 py-2 rounded border border-[#DFE1E6] hover:border-[#4C9AFF] focus:border-[#0052CC] focus:ring-2 focus:ring-[#DEEBFF] outline-none transition-all placeholder:text-slate-400"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#5E6C84] mb-1.5">
                  Campaign Classifications <span className="text-[#FF5630]">*</span>
                </label>
                <div className="flex flex-col gap-2">
                  {typeConfig.map(tc => (
                    <label
                      key={tc.key}
                      onClick={() => toggleType(tc.key)}
                      className={`p-2.5 rounded border flex items-center gap-3 cursor-pointer transition-all ${
                        types.includes(tc.key) ? tc.active : 'bg-[#FAFBFC] border-[#DFE1E6] hover:bg-[#F4F5F7]'
                      }`}
                    >
                      <input
                        type="checkbox"
                        checked={types.includes(tc.key)}
                        onChange={() => {}}
                        className="w-4 h-4 rounded border-[#DFE1E6] text-[#0052CC] focus:ring-[#0052CC]"
                      />
                      <div>
                        <span className="text-xs font-bold block">{tc.label}</span>

                      </div>
                    </label>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-[#5E6C84] mb-1.5">
                  Priority

                <select
                  value={priority}
                  onChange={(e) => setPriority(e.target.value)}

                >

                  <option value="medium">Medium Priority</option>
                  <option value="low">Low Priority</option>

              </div>

              <div>
                <label className="block text-xs font-semibold text-[#5E6C84] mb-1.5">

                <textarea
                  rows={2}
                  value={caption}
                  onChange={(e) => setCaption(e.target.value)}

              <div className="text-[11px] text-[#5E6C84] bg-[#FAFBFC] border border-[#DFE1E6] rounded p-2.5">
                Submitting as <strong className="text-[#172B4D]">{currentUser?.name}</strong>. Deliverable will be routed to the <strong>Submissions</strong> column.
              </div>

              <div className="pt-3 border-t border-[#EBECF0] flex items-center justify-end gap-2.5 mt-1">
                <button
                  type="button"
                  onClick={onClose}
                  className="text-sm font-medium px-4 py-2 rounded text-[#5E6C84] hover:bg-[#EBECF0] transition-colors"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="text-sm font-semibold px-4 py-2 rounded text-white bg-[#0052CC] hover:bg-[#0747A6] shadow-xs transition-colors"
                >
                  Create Deliverable
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

          return s ? JSON.parse(s) : null;
        } catch(e) {
          return null;
        }
      });

        try {
          const s = localStorage.getItem('aiesec_cs_tracker_cards_v4') || localStorage.getItem('ogv_jira_rbac_cards_v4');
          return s ? JSON.parse(s) : INITIAL_CARDS;
        } catch(e) {

        }
      });

      const [activeView, setActiveView] = useState('kanban');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [selectedCard, setSelectedCard] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [toasts, setToasts] = useState([]);
      const [backendStatus, setBackendStatus] = useState({ status: 'checking', database: 'local_storage', message: '' });

      const currentRole = currentUser?.role || 'member';

      useEffect(() => {
        let isMounted = true;
        async function syncRemoteData() {
          try {
            const hRes = await fetch('/api/health');
            if (hRes.ok) {
              const hData = await hRes.json();
              if (isMounted) setBackendStatus(hData);
            }
            const fRes = await fetch('/api/flyers');
            if (fRes.ok) {
              const fData = await fRes.json();
              if (isMounted && fData.data && fData.data.length > 0) {
                setCards(fData.data);
              }
            }
          } catch(e) {
            // Running offline or standalone HTML file
          }
        }
        syncRemoteData();
        return () => { isMounted = false; };
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('aiesec_cs_tracker_cards_v4', JSON.stringify(cards));
        } catch(e) {}
      }, [cards]);

      useEffect(() => {
        try {
          if (currentUser) localStorage.setItem('aiesec_cs_tracker_auth_session', JSON.stringify(currentUser));
          else {
            localStorage.removeItem('aiesec_cs_tracker_auth_session');
            localStorage.removeItem('ogv_jira_auth_session');
          }
        } catch(e) {}
      }, [currentUser]);

      useEffect(() => {
        function handleKeyDown(e) {
          if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
          if (e.key === 'c' || e.key === 'C') {
            e.preventDefault();
            setIsAddModalOpen(true);
          } else if (e.key === '[') {
            e.preventDefault();
            setSidebarCollapsed(prev => !prev);
          } else if (e.key === 'Escape') {
            setIsAddModalOpen(false);
            setSelectedCard(null);
          }
        }
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const showToast = ({ type = 'info', title, message }) => {
        const id = `t-${Date.now()}-${Math.random()}`;
        setToasts(prev => [...prev, { id, type, title, message }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      const handleDismissToast = (id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      };

      const handleLogin = (u) => {
        setCurrentUser(u);
        showToast({
          type: 'success',
          title: 'Logged In',
          message: `Welcome to AIESEC in CS Tracker, ${u.name} (${ROLE_DEFINITIONS[u.role]?.clearanceLevel})`
        });
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('aiesec_cs_tracker_auth_session');
        localStorage.removeItem('ogv_jira_auth_session');
      };

      const handleRoleChange = (role) => {
        const matched = USERS.find(u => u.role === role);
        if (matched) {
          setCurrentUser(matched);
          showToast({
            type: 'info',
            title: 'Role Switched',
            message: `Now evaluating as: ${matched.name} (${ROLE_DEFINITIONS[role]?.clearanceLevel})`
          });
        }
      };

      const handleMoveCard = (cardId, targetCol, commentText = '') => {
        const card = cards.find(c => c.id === cardId);
        if (!card) return;

        const ck = canTransition(currentRole, card.column, targetCol);
        if (!ck.allowed) {
          showToast({ type: 'error', title: 'Permission Denied', message: ck.reason });
          return;
        }

        const now = new Date();
        const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const roleTitles = { member: 'Team Member', leader: 'Team Leader', lcvp: 'LCVP oGV B2C', admin: 'Candidate LCVP TM' };
        const colNames = { member: 'Submissions', leader: 'Leader Review', lcvp: 'Ready to Post' };
        const note = commentText || `Moved from [${colNames[card.column]}] to [${colNames[targetCol]}].`;

        const updComments = [
          ...(card.comments || []),
          {
            id: `c-${Date.now()}`,
            authorName: currentUser.name,
            authorRole: roleTitles[currentUser.role] || currentUser.role,
            text: note,
            timestamp: ts,
            isMovementLog: true
          }
        ];

        const updCards = cards.map(c => c.id === cardId ? { ...c, column: targetCol, comments: updComments } : c);
        setCards(updCards);
        if (selectedCard && selectedCard.id === cardId) {
          setSelectedCard({ ...selectedCard, column: targetCol, comments: updComments });
        }

        // Remote sync with Supabase Backend API
        fetch(`/api/flyers/${cardId}/column`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            targetColumn: targetCol,
            userRole: currentRole,
            userId: currentUser.id,
            userName: currentUser.name,
            commentText: note
          })
        }).catch(() => {});
      };

      const handleAddFlyer = ({ title, canvaUrl, caption, priority, types }) => {
        const now = new Date();
        const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const count = cards.length + 1;
        const newCard = {
          id: `KB-${String(count).padStart(2,'0')}`,
          key: `OGV-10${count}`,
          title,
          canvaUrl,
          caption,
          priority: priority || 'medium',
          types: types.length > 0 ? types : ['trend_based'],
          column: 'member',
          uploaderName: currentUser.name,
          uploaderId: currentUser.id,
          uploaderRole: currentUser.role,
          teamName: currentUser.teamName || 'Team Alpha (Global Classroom)',
          createdAt: ts,
          comments: [
            {
              id: `c-init-${Date.now()}`,
              authorName: currentUser.name,
              authorRole: currentUser.title || 'Team Member',
              text: `Created deliverable. Category: ${types.join(', ')}.`,
              timestamp: ts
            }
          ]
        };
        setCards([newCard, ...cards]);

        // Remote sync with Supabase Backend API
        fetch('/api/flyers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            canvaUrl,
            caption,
            priority: priority || 'medium',
            types,
            uploaderName: currentUser.name,
            uploaderId: currentUser.id,
            uploaderRole: currentUser.role,
            teamName: currentUser.teamName || 'Team Alpha (Global Classroom)'
          })
        }).catch(() => {});
      };

      const handleAddComment = (cardId, text) => {
        const now = new Date();
        const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        const roleTitles = { member: 'Team Member', leader: 'Team Leader', lcvp: 'LCVP oGV B2C', admin: 'Candidate LCVP TM' };
        const nc = {
          id: `c-${Date.now()}`,
          authorName: currentUser.name,
          authorRole: roleTitles[currentUser.role] || currentUser.role,
          text,
          timestamp: ts
        };
        setCards(cards.map(c => c.id === cardId ? { ...c, comments: [...(c.comments || []), nc] } : c));
        if (selectedCard && selectedCard.id === cardId) {
          setSelectedCard({ ...selectedCard, comments: [...(selectedCard.comments || []), nc] });
        }

        // Remote sync with Supabase Backend API
        fetch(`/api/flyers/${cardId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            authorName: currentUser.name,
            authorRole: roleTitles[currentUser.role] || currentUser.role,
            authorId: currentUser.id,
            text
          })
        }).catch(() => {});
      };

      const handleSeedDatabase = async () => {
        try {
          const res = await fetch('/api/seed', { method: 'POST' });
          const json = await res.json();
          if (res.ok && json.success) {
            const fRes = await fetch('/api/flyers');
            if (fRes.ok) {
              const fData = await fRes.json();
              if (fData.data && fData.data.length > 0) setCards(fData.data);
            }
          }
          return json;
        } catch(e) {
          return { error: e.message };
        }
      };

      const handleResetData = () => {
        if (confirm('Reset to initial demo data?')) {
          localStorage.removeItem('aiesec_cs_tracker_cards_v4');
          localStorage.removeItem('ogv_jira_rbac_cards_v4');
          setCards(INITIAL_CARDS);
          showToast({ type: 'info', title: 'Data Reset', message: 'Demo cards restored to default state.' });
        }
      };

      if (!currentUser) return <LoginScreen onLogin={handleLogin} />;

      const readyCount = cards.filter(c => c.column === 'lcvp').length;

      return (
        <div className="min-h-screen bg-[#F4F5F7] text-[#172B4D] flex flex-col font-sans antialiased">
          <TrackerNavbar
            currentUser={currentUser}
            currentRole={currentRole}
            onRoleChange={handleRoleChange}
            onOpenAddModal={() => setIsAddModalOpen(true)}
            onLogout={handleLogout}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            sidebarCollapsed={sidebarCollapsed}
            setSidebarCollapsed={setSidebarCollapsed}
          />

          <div className="flex-1 flex overflow-hidden">
            <TrackerSidebar
              activeView={activeView}
              onViewChange={setActiveView}
              collapsed={sidebarCollapsed}
              setCollapsed={setSidebarCollapsed}
              cardsCount={cards.length}
              readyCount={readyCount}
            />

            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-7 max-w-7xl mx-auto w-full">
              {activeView === 'kanban' && (
                <KanbanBoard
                  cards={cards}
                  currentRole={currentRole}
                  currentUser={currentUser}
                  onCardClick={setSelectedCard}
                  onMoveCard={handleMoveCard}
                  onOpenAddModal={() => setIsAddModalOpen(true)}
                  searchQuery={searchQuery}
                  setSearchQuery={setSearchQuery}
                  onShowToast={showToast}
                />
              )}

              {activeView === 'roadmap' && (
                <RoadmapView
                  cards={cards}
                  onCardClick={setSelectedCard}
                />
              )}

              {activeView === 'releases' && (
                <ReleasesView
                  cards={cards}
                  onCardClick={setSelectedCard}
                />
              )}

              {activeView === 'scoreboard' && (
                <ScoreboardView
                  cards={cards}
                  users={USERS}
                />
              )}

              {activeView === 'team' && (
                <TeamDirectoryView
                  users={USERS}
                  cards={cards}
                />
              )}

              {activeView === 'admin' && (
                <AdminView
                  users={USERS}
                  onResetData={handleResetData}
                  onRoleChange={handleRoleChange}
                  onShowToast={showToast}
                  backendStatus={backendStatus}
                  onTriggerSeed={handleSeedDatabase}
                />
              )}
            </main>
          </div>

          <AddFlyerModal
            isOpen={isAddModalOpen}
            onClose={() => setIsAddModalOpen(false)}
            onAddFlyer={handleAddFlyer}
            currentUser={currentUser}
            onShowToast={showToast}
          />

          <CardDetailModal
            card={selectedCard}
            isOpen={!!selectedCard}
            onClose={() => setSelectedCard(null)}
            currentRole={currentRole}
            onMoveCard={handleMoveCard}
            onAddComment={handleAddComment}
            currentUser={currentUser}
            onShowToast={showToast}
          />

          <ToastContainer toasts={toasts} onDismiss={handleDismissToast} />
        </div>
      );
    }

    // =========================================================================
    // MOUNT TO DOM
    // =========================================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
